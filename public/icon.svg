<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#0D2D4F"/>
      <stop offset="100%" stop-color="#061828"/>
    </linearGradient>
    <linearGradient id="gold" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#C9A14A"/>
      <stop offset="100%" stop-color="#E6B450"/>
    </linearGradient>
  </defs>
  <!-- Base -->
  <rect width="64" height="64" rx="15" fill="url(#bg)"/>
  <!-- Teal ring -->
  <circle cx="32" cy="26" r="15" fill="none" stroke="#00C4B4" stroke-width="1.5" opacity="0.9"/>
  <!-- Crown silhouette -->
  <path d="M17 26 L23.5 13.5 L32 20 L40.5 13.5 L47 26" fill="none" stroke="url(#gold)" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"/>
  <!-- Crown base -->
  <rect x="16" y="26" width="32" height="4" rx="2" fill="#C9A14A" opacity="0.85"/>
  <!-- MRZ lines -->
  <rect x="12" y="37" width="40" height="3" rx="1.5" fill="white" opacity="0.75"/>
  <rect x="12" y="43" width="30" height="2.5" rx="1.25" fill="white" opacity="0.40"/>
  <rect x="12" y="48" width="34" height="2.5" rx="1.25" fill="white" opacity="0.40"/>
  <!-- Gold bottom accent -->
  <rect x="8" y="56.5" width="48" height="3.5" rx="1.75" fill="url(#gold)"/>
</svg>
